<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Приглашение на свадьбу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  /* Основная тема сайта: элегантный чёрно-белый editorial-стиль (белый
     преобладает), задуман под совместное чёрно-белое фото со студийной
     фотосессии — как только оно будет готово, вставьте его в
     CONFIG.photoUrl. Это осознанный стиль, а не «светлая тема» по
     умолчанию — сайт всегда чёрно-белый, независимо от темы устройства. */
  /* Палитра целиком взята из тонов самого фото (оно нейтрально
     чёрно-белое: студийный серый фон, белые футболки, тёмные брюки/стул) —
     без добавленных цветов вроде сепии или бежевого. */
  :root{
    --bg:#dcdcda;
    --bg-card:#f7f7f5;
    --text:#181818;
    --text-soft:#828280;
    --accent:#181818;
    --accent-2:#8f8f8c;
    --line:#c9c9c6;
    --danger:#b5544a;
    --ok:#4c7a5e;
    --shadow: 0 14px 34px rgba(0,0,0,.10);
    --radius:22px;
    /* Основной шрифт — современный гротеск (без засечек/антиквы) везде,
       включая заголовки и цитату; курсив для акцентов и цитат берётся
       из курсивного начертания того же Montserrat, а не отдельного
       рукописного/антиквенного шрифта. */
    --serif:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sans:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --display:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --body-serif:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ===== Тема «люкс»: тёмный фон, золото, art-deco — по референсу пользователя.
     Это осознанный выбор оформления (не следует системной теме устройства). ===== */
  body.theme-lux{
    --bg:#0d0b0a;
    --bg-card:#171310;
    --text:#f3ead9;
    --text-soft:#b8a98f;
    --accent:#c9a24a;
    --accent-2:#8a2432;
    --line:#3a3126;
    --shadow: 0 14px 46px rgba(0,0,0,.55);
    --display:'Cinzel', Georgia, serif;
    --body-serif:'Cormorant Garamond', Georgia, serif;
    background-color:#0d0b0a;
  }
  body.theme-lux .kicker,
  body.theme-lux .section-title .sub{
    font-family:var(--sans);
    color:var(--accent);
  }
  body.theme-lux .hero h1,
  body.theme-lux .section-title,
  body.theme-lux .hero-photo .monogram{
    font-family:var(--display);
    letter-spacing:.03em;
  }
  body.theme-lux .hero .date{
    font-family:var(--body-serif);
    font-size:22px;
    letter-spacing:.06em;
  }
  body.theme-lux .greeting,
  body.theme-lux .val,
  body.theme-lux p{
    font-family:var(--body-serif);
    font-size:17px;
  }
  body.theme-lux .btn{
    background:var(--accent-2);
    color:#f3ead9;
    border:1px solid var(--accent);
  }
  body.theme-lux .btn.secondary{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
  }
  body.theme-lux .opt.checked{
    border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 20%, var(--bg-card));
    color:var(--accent);
  }
  body.theme-lux .card,
  body.theme-lux .greeting,
  body.theme-lux .countdown .box,
  body.theme-lux .hero-photo{
    border-color:var(--line);
  }
  body.theme-lux .detail-row .ico{
    filter:grayscale(1) brightness(1.7) sepia(1) hue-rotate(-8deg) saturate(2.4);
    opacity:.85;
  }
  body.theme-lux .thanks .big{
    filter:grayscale(1) brightness(1.7) sepia(1) hue-rotate(-8deg) saturate(2.4);
  }
  body.theme-lux::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 15%, rgba(201,162,74,.55), transparent),
      radial-gradient(1.5px 1.5px at 75% 8%, rgba(201,162,74,.4), transparent),
      radial-gradient(1px 1px at 60% 30%, rgba(201,162,74,.35), transparent),
      radial-gradient(1.5px 1.5px at 30% 45%, rgba(201,162,74,.3), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(201,162,74,.3), transparent),
      radial-gradient(1.5px 1.5px at 10% 70%, rgba(201,162,74,.3), transparent),
      radial-gradient(1px 1px at 50% 85%, rgba(201,162,74,.25), transparent);
    background-repeat:no-repeat;
    background-size:100% 2600px;
  }

  .intro-veil{
    position:fixed;inset:0;z-index:50;
    background:#0d0b0a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;
    cursor:pointer;
    transition:opacity .7s ease, visibility .7s ease;
  }
  .intro-veil.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .intro-veil .ring{
    width:88px;height:88px;border-radius:50%;
    border:1px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
    font-family:'Cinzel', serif;
    font-size:26px;
    animation:pulseRing 2.6s ease-in-out infinite;
  }
  @keyframes pulseRing{
    0%,100%{box-shadow:0 0 0 0 rgba(201,162,74,.25);}
    50%{box-shadow:0 0 0 10px rgba(201,162,74,0);}
  }
  .intro-veil .txt{
    font-family:var(--sans);
    font-size:11.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--text-soft);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(760px 380px at 14% -4%, rgba(0,0,0,.05), transparent 70%),
      radial-gradient(640px 320px at 90% 4%, rgba(0,0,0,.04), transparent 70%),
      radial-gradient(700px 500px at 100% 60%, rgba(0,0,0,.03), transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }
  /* Фоновая фотография (необязательная): задаётся из CONFIG.bgPhotoUrl —
     на весь экран, затемнена/размыта/обесцвечена и приглушена белой
     «дымкой» сверху, чтобы текст поверх неё оставался читаемым, а лица на
     фото не спорили за внимание с портретом в шапке. Если фото не задано —
     просто мягкий белый фон (как сейчас). */
  body:not(.theme-lux)::before{
    content:"";
    position:fixed;
    inset:-20px;
    z-index:0;
    pointer-events:none;
    background-image:var(--bg-photo, none);
    background-size:cover;
    background-position:center;
    filter:grayscale(1) blur(18px) brightness(1.12) contrast(.94);
    opacity:.22;
  }
  body:not(.theme-lux)::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:rgba(220,220,218,.78);
  }
  .ornament{
    display:flex;align-items:center;justify-content:center;gap:0;
    color:var(--accent-2);
    margin:14px 0;
  }
  .hero-photo{
    width:100%;
    max-width:270px;
    aspect-ratio:3/4;
    margin:0 auto 26px;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    gap:10px;
    background:var(--bg-card);
    border-radius:135px 135px 20px 20px;
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
  }
  .hero-photo img{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(1) contrast(1.05);
  }
  .hero-photo .monogram{
    font-family:var(--serif);
    font-size:40px;
    color:var(--text);
    display:flex;align-items:center;gap:6px;
  }
  .hero-photo .monogram .amp-small{font-style:italic;font-size:.55em;color:var(--text-soft);}
  .hero-photo .placeholder-note{
    font-family:var(--sans);
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-soft);
  }
  /* ===== Современный вариант шапки: фото на весь экран, имена и дата
     написаны поверх светлой (студийной, фоновой) части фото — она у этого
     кадра сверху, так что текст ложится на пустой светлый фон и не
     задевает фигуры. Палитра — чистый чёрно-белый, взятый из самого фото
     (без добавленных цветов). ===== */
  .hero-modern{
    position:relative;
    width:calc(100% + 40px);
    margin:0 -20px;
    aspect-ratio:3/4;
    overflow:hidden;
    background:var(--bg);
  }
  .hero-modern img{
    width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;
    filter:grayscale(1) contrast(1.08);
    transform:scale(1.08);
    transform-origin:right 58%;
  }
  .hero-modern::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 34%);
    pointer-events:none;
  }
  .hero-modern .hero-overlay{
    position:absolute; left:0; right:0; top:0;
    padding:34px 28px 0;
    color:#161616;
    text-align:left;
  }
  .hero-modern .kicker{
    font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:#5c5c5a;margin-bottom:12px;
  }
  .hero-modern h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(38px,11vw,60px);
    line-height:.98;
    margin:0;
    letter-spacing:-.02em;
  }
  .hero-modern h1 .amp{
    display:inline-block;
    font-style:italic;
    font-weight:400;
    color:#c0392b;
    font-size:.62em;
    margin:0 5px;
  }
  .hero-modern .date{
    font-family:var(--sans);
    font-size:12.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#2a2a29;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid rgba(22,22,22,.22);
    display:inline-block;
  }
  .hero-below{
    text-align:center;
    padding:26px 20px 6px;
  }
  .hero-below .quote{
    font-family:var(--body-serif);
    font-style:italic;
    font-size:19px;
    color:var(--text-soft);
    padding:0 8px;
  }
  .reveal{
    opacity:0;
    transform:translateY(16px);
    transition:opacity .6s ease, transform .6s ease;
  }
  .reveal.in{
    opacity:1;
    transform:translateY(0);
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 20px 80px;position:relative;z-index:1;}
  .hero{
    text-align:center;
    padding:64px 20px 40px;
    position:relative;
  }
  .hero .kicker{
    font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-2);margin-bottom:18px;
  }
  .hero h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(34px,8vw,56px);
    margin:0 0 8px;
    line-height:1.1;
  }
  .hero .amp{
    display:block;
    font-style:italic;
    color:#c0392b;
    font-size:.55em;
    margin:6px 0;
  }
  .hero .date{
    font-family:var(--serif);
    font-size:20px;
    color:var(--text-soft);
    margin-top:14px;
  }
  .hero .quote{
    font-family:var(--body-serif);
    font-style:italic;
    font-size:19px;
    color:var(--text-soft);
    margin-top:18px;
    padding:0 12px;
  }
  .greeting{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
    margin:18px 0 28px;
    box-shadow:var(--shadow);
    font-size:15.5px;
  }
  .greeting b{color:var(--accent);}
  .countdown{
    display:flex;justify-content:center;gap:10px;margin:28px 0 8px;flex-wrap:wrap;
  }
  .countdown .box{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    min-width:68px;
    padding:12px 6px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .countdown .num{
    font-family:var(--serif);font-size:24px;font-weight:600;color:var(--accent);
    display:inline-block;
  }
  .countdown .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-soft);margin-top:2px;}
  .countdown .box.sec{border-color:#c0392b;}
  .countdown .box.sec .num{color:#c0392b;}
  @keyframes cdFlip{
    0%{ transform:translateY(-9px) scale(1.18); opacity:.2; }
    55%{ transform:translateY(2px) scale(1.05); opacity:1; }
    100%{ transform:translateY(0) scale(1); opacity:1; }
  }
  .countdown .num.flip{ animation:cdFlip .5s cubic-bezier(.34,1.56,.64,1); }
  .countdown-done{
    text-align:center;font-family:var(--serif);font-weight:700;font-size:20px;
    color:#c0392b;letter-spacing:.02em;
  }
  section.card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 26px;
    margin:22px 0;
    box-shadow:var(--shadow);
  }
  h2.section-title{
    font-family:var(--serif);
    font-size:22px;
    font-weight:600;
    margin:0 0 18px;
    text-align:center;
  }
  h2.section-title .sub{
    display:block;font-family:var(--sans);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent-2);margin-bottom:6px;font-weight:600;
  }
  .detail-row{
    display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);
  }
  .detail-row:last-child{border-bottom:none;}
  .detail-row .ico{font-size:20px;width:28px;flex-shrink:0;text-align:center;}
  .detail-row .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-soft);margin-bottom:2px;}
  .detail-row .val{font-size:15.5px;}
  .detail-row .val a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);}
  .btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:30px;
    padding:14px 28px;
    font-family:var(--sans);
    font-weight:600;
    font-size:14.5px;
    letter-spacing:.02em;
    cursor:pointer;
    text-decoration:none;
    text-align:center;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  fieldset{border:none;margin:0 0 24px;padding:0;}
  legend{
    font-weight:600;font-size:15px;margin-bottom:10px;padding:0;
    display:flex;align-items:center;gap:8px;
  }
  legend .req{color:var(--danger);font-weight:400;font-size:12px;}
  .opt-grid{display:flex;flex-wrap:wrap;gap:9px;}
  .opt{
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:11px 16px;
    font-size:14px;
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
    background:var(--bg-card);
    color:var(--text);
  }
  .opt input{position:absolute;opacity:0;width:0;height:0;}
  .opt.checked{
    border-color:var(--text);
    background:var(--text);
    color:var(--bg);
    font-weight:600;
  }
  label.field{display:block;margin-bottom:20px;}
  label.field .flabel{font-weight:600;font-size:15px;margin-bottom:8px;display:block;}
  label.field .hint{font-weight:400;font-size:12.5px;color:var(--text-soft);margin-top:4px;}
  input[type=text], textarea{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-family:var(--sans);
    font-size:15px;
    background:var(--bg);
    color:var(--text);
    resize:vertical;
  }
  input[type=text]:focus, textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:70px;}
  .banner{
    background:color-mix(in srgb, var(--accent-2) 18%, var(--bg-card));
    border:1px solid var(--accent-2);
    border-radius:14px;
    padding:14px 16px;
    font-size:13.5px;
    margin-bottom:22px;
    text-align:center;
  }
  .error{color:var(--danger);font-size:13px;margin-top:6px;display:none;}
  .thanks{text-align:center;padding:20px 4px;}
  .thanks .big{font-size:44px;margin-bottom:6px;}
  .thanks h3{font-family:var(--serif);font-size:26px;margin:6px 0;}
  footer{text-align:center;color:var(--text-soft);font-size:12.5px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);}
  .divider{text-align:center;color:var(--accent-2);font-size:20px;margin:6px 0 2px;letter-spacing:6px;}
  .plusone-block{
    border:1.5px dashed var(--line);
    border-radius:14px;
    padding:16px;
    margin-top:6px;
  }
  @media (max-width:420px){
    .countdown .box{min-width:58px;padding:10px 4px;}
    .countdown .num{font-size:20px;}
  }

</style>
</head>
<body>
<div class="intro-veil" id="introVeil" style="display:none;">
  <div class="ring">Г&nbsp;&amp;&nbsp;Д</div>
  <div class="txt">Нажмите, чтобы открыть приглашение</div>
</div>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   КОНФИГ СВАДЬБЫ — здесь и только здесь меняются все данные.
   Это и есть «конструктор»: заполни поля своими значениями —
   остальной код трогать не нужно.
   ============================================================ */
const CONFIG = {
  // Оформление: 'classic' — основная тема, элегантный чёрно-белый editorial-
  // стиль (сайт сейчас в ней), 'lux' — тёмная золотая тема с завесой-
  // приветствием (пробовали, не подошла, но код оставлен на всякий случай).
  theme: 'classic',

  // Имена молодожёнов
  groomName: "Герман",
  brideName: "Диляра",

  // Дата и время в формате ISO (используется для обратного отсчёта)
  eventDateISO: "2026-10-09T16:00:00+03:00",
  eventDateHuman: "9 октября 2026",
  eventTimeHuman: "16:00",

  // Место проведения
  venueName: "Perfect Pitch",
  venueAddress: "г. Москва, Берсеневский пер., 5, стр. 2, этаж 2",
  venueMapLink: "https://yandex.ru/maps/-/CTTJQT4t", // ссылка на Яндекс/Google карты

  // Ваше совместное фото (прямая ссылка на изображение или data:-URI) —
  // как будет готово со студийной съёмки, вставьте сюда. Сайт сам
  // обесцветит фото до чёрно-белого (даже если оно цветное), так что можно

/* ============================================================ */

document.body.classList.toggle('theme-lux', CONFIG.theme === 'lux');
document.documentElement.style.setProperty('--bg-photo', CONFIG.bgPhotoUrl ? `url("${CONFIG.bgPhotoUrl}")` : 'none');

function setupIntroVeil(){
  const veil = document.getElementById('introVeil');
  if(CONFIG.theme !== 'lux'){ veil.style.display = 'none'; return; }
  veil.style.display = 'flex';
  const dismiss = () => veil.classList.add('hide');
  veil.addEventListener('click', dismiss, { once: true });
  // на всякий случай не даём «завесе» остаться навсегда, если что-то пошло не так
  setTimeout(dismiss, 6000);
}

const params = new URLSearchParams(location.search);
const linkGuestName = params.get('name') ? decodeURIComponent(params.get('name')) : '';
const allowPlusOne = params.get('plus1') !== '0'; // по умолчанию разрешено; ?plus1=0 — скрыть блок +1

let state = {
  step: 'form', // form | sent
  name: linkGuestName,
  attending: null,   // 'yes' | 'no'
  plusOne: null,     // 'yes' | 'no'
  plusOneName: '',
  drinks: new Set(),
  food: null,
  plusOneDrinks: new Set(),
  plusOneFood: null,
  allergies: '',
  notes: '',
  errors: {}
};

function esc(s){
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(iso){
  try{
    return new Date(iso).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
  }catch(e){ return ''; }
}

function optChip(name, value, checked, group){
  return `<label class="opt ${checked?'checked':''}" data-group="${group}" data-value="${esc(value)}">
    <input type="checkbox" ${checked?'checked':''}> ${esc(value)}
  </label>`;
}

function radioChip(group, value, checked, label){
  return `<label class="opt ${checked?'checked':''}" data-group="${group}" data-value="${esc(value)}">
    <input type="radio" name="${group}" ${checked?'checked':''}> ${esc(label !== undefined ? label : value)}
  </label>`;
}

function render(){
  const app = document.getElementById('app');

  if(state.step === 'sent'){
    app.innerHTML = renderThanks();
    attachSentHandlers();
    setupReveal();
    return;
  }

  app.innerHTML = `
    ${!CONFIG.webhookUrl ? `<div class="banner">⚠️ Демо-режим: форма работает, но ответы никуда не сохраняются, пока не подключён webhookUrl (см. SPEC.md)</div>` : ''}

    ${CONFIG.photoUrl ? `
    <div class="hero-modern reveal">
      <img src="${esc(CONFIG.photoUrl)}" alt="">
      <div class="hero-overlay">
        <div class="kicker">Приглашение на свадьбу</div>
        <h1>${esc(CONFIG.groomName)}<span class="amp">&amp;</span>${esc(CONFIG.brideName)}</h1>
        <div class="date">${esc(CONFIG.eventDateHuman)} · ${esc(CONFIG.eventTimeHuman)}</div>
      </div>
    </div>
    ${CONFIG.personalQuote ? `<div class="hero-below reveal"><div class="quote">«${esc(CONFIG.personalQuote)}»</div></div>` : ''}
    ` : `
    <div class="hero reveal">
      <div class="hero-photo">
        <div class="monogram">${esc((CONFIG.groomName||'?')[0])}<span class="amp-small">&amp;</span>${esc((CONFIG.brideName||'?')[0])}</div><div class="placeholder-note">Здесь будет ваше фото</div>
      </div>
      <div class="kicker">Приглашение на свадьбу</div>
      <h1>${esc(CONFIG.groomName)}<span class="amp">&amp;</span>${esc(CONFIG.brideName)}</h1>
      <div class="ornament">${ornamentSvg()}</div>
      <div class="date">${esc(CONFIG.eventDateHuman)} · ${esc(CONFIG.eventTimeHuman)}</div>
      ${CONFIG.personalQuote ? `<div class="quote">«${esc(CONFIG.personalQuote)}»</div>` : ''}
    </div>
    `}

    <div class="countdown" id="countdown"></div>

    ${linkGuestName ? `<div class="greeting reveal">Дорог${guessEnding(linkGuestName)} <b>${esc(linkGuestName)}</b>! ${esc(CONFIG.welcomeText)}</div>` : `<div class="greeting reveal">${esc(CONFIG.welcomeText)}</div>`}

    <section class="card reveal">
      <h2 class="section-title"><span class="sub">Детали</span>Когда и где</h2>
      <div class="detail-row">
        <div class="ico">📅</div>
        <div><div class="label">Дата и время</div><div class="val">${esc(CONFIG.eventDateHuman)}, ${esc(CONFIG.eventTimeHuman)}</div></div>
      </div>
      <div class="detail-row">
        <div class="ico">📍</div>
        <div><div class="label">Место</div><div class="val">${esc(CONFIG.venueName)}<br>${esc(CONFIG.venueAddress)} — <a href="${esc(CONFIG.venueMapLink)}" target="_blank" rel="noopener">открыть карту</a></div></div>
      </div>
      ${CONFIG.dressCode ? `<div class="detail-row">
        <div class="ico">👗</div>
        <div><div class="label">Дресс-код</div><div class="val">${esc(CONFIG.dressCode)}</div></div>
      </div>` : ''}
      <div class="detail-row">
        <div class="ico">⏳</div>
        <div><div class="label">Ответить нужно до</div><div class="val">${esc(CONFIG.rsvpDeadlineHuman)}</div></div>
      </div>
    </section>

    <div class="ornament reveal">${ornamentSvg()}</div>

    <section class="card reveal">
      <h2 class="section-title"><span class="sub">Подтверждение</span>Ждём вашего ответа</h2>
      <form id="rsvpForm" novalidate>

        <label class="field">
          <span class="flabel">Ваше имя <span style="color:var(--danger)">*</span></span>
          <input type="text" id="f-name" value="${esc(state.name)}" placeholder="Имя и фамилия">
          <div class="error" id="err-name">Пожалуйста, укажите имя</div>
        </label>

        <fieldset>
          <legend>Вы сможете прийти? <span class="req">*</span></legend>
          <div class="opt-grid" id="g-attending">
            ${radioChip('attending','yes', state.attending==='yes', 'Да, буду!')}
            ${radioChip('attending','no', state.attending==='no', 'Не смогу')}
          </div>
          <div class="error" id="err-attending">Выберите один из вариантов</div>
        </fieldset>

        <div id="attendingBlock" style="display:${state.attending==='yes' ? 'block':'none'}">

          ${allowPlusOne ? `
          <fieldset>
            <legend>Будете с +1?</legend>
            <div class="opt-grid" id="g-plusone">
              ${radioChip('plusone','yes', state.plusOne==='yes', 'Да')}
              ${radioChip('plusone','no', state.plusOne==='no', 'Нет')}
            </div>
          </fieldset>
          ` : ''}

          <fieldset>
            <legend>Что будете пить? <span class="req">(можно несколько)</span></legend>
            <div class="opt-grid" id="g-drinks">
              ${CONFIG.drinkOptions.map(d => optChip('drinks', d, state.drinks.has(d), 'drinks')).join('')}
            </div>
          </fieldset>

          <fieldset>
            <legend>Горячее блюдо <span class="req">*</span></legend>
            <div class="opt-grid" id="g-food">
              ${CONFIG.foodOptions.map(f => radioChip('food', f, state.food===f)).join('')}
            </div>
            <div class="error" id="err-food">Выберите блюдо</div>
          </fieldset>

          <div id="plusOneBlock" style="display:${state.plusOne==='yes' && allowPlusOne ? 'block':'none'}" class="plusone-block">
            <div style="font-weight:600;margin-bottom:12px;">Данные для +1</div>
            <label class="field">
              <span class="flabel">Имя +1 <span style="color:var(--danger)">*</span></span>
              <input type="text" id="f-plusOneName" value="${esc(state.plusOneName)}" placeholder="Имя и фамилия">
              <div class="error" id="err-plusOneName">Пожалуйста, укажите имя и фамилию +1</div>
            </label>
            <fieldset>
              <legend>Что будет пить +1? <span class="req">(можно несколько)</span></legend>
              <div class="opt-grid" id="g-podrinks">
                ${CONFIG.drinkOptions.map(d => optChip('podrinks', d, state.plusOneDrinks.has(d), 'podrinks')).join('')}
              </div>
            </fieldset>
            <fieldset>
              <legend>Горячее для +1</legend>
              <div class="opt-grid" id="g-pofood">
                ${CONFIG.foodOptions.map(f => radioChip('pofood', f, state.plusOneFood===f)).join('')}
              </div>
            </fieldset>
          </div>

          <label class="field">
            <span class="flabel">Аллергии / пищевые ограничения</span>
            <textarea id="f-allergies" placeholder="Например: аллергия на орехи (необязательно)">${esc(state.allergies)}</textarea>
          </label>

          <label class="field">
            <span class="flabel">Пожелания ведущему</span>
            <textarea id="f-notes" placeholder="Хотите сказать тост, есть просьбы или пожелания к программе вечера? (необязательно)">${esc(state.notes)}</textarea>
            <div class="hint">Например: «хочу сказать тост», «не люблю конкурсы на публику» и т.п.</div>
          </label>
        </div>

        <div id="declinedNote" style="display:${state.attending==='no' ? 'block':'none'}">
          <label class="field">
            <span class="flabel">Хотите что-то передать?</span>
            <textarea id="f-notesDecline" placeholder="Необязательно">${esc(state.notes)}</textarea>
          </label>
        </div>

        <div class="btn-row" style="margin-top:8px;">
          <button type="submit" class="btn" id="submitBtn">Отправить ответ</button>
        </div>
      </form>
    </section>

    <footer>
      По всем вопросам — ${esc(CONFIG.contactName)}, ${esc(CONFIG.contactPhone)}<br>
      Будем рады видеть вас на нашем празднике
    </footer>
  `;

  startCountdown();
  attachFormHandlers();
  setupReveal();
}

function ornamentSvg(){
  return `<svg width="130" height="22" viewBox="0 0 130 22" fill="none" aria-hidden="true">
    <line x1="0" y1="11" x2="50" y2="11" stroke="currentColor" stroke-width="1"/>
    <path d="M65 2 L74 11 L65 20 L56 11 Z" stroke="currentColor" stroke-width="1" fill="none"/>
    <line x1="80" y1="11" x2="130" y2="11" stroke="currentColor" stroke-width="1"/>
  </svg>`;
}

function setupReveal(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){
    els.forEach(el => el.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('in');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  els.forEach(el => io.observe(el));
}

function guessEnding(name){
  // очень грубая эвристика рода по имени для "дорогой/дорогая" — если не уверены, используем нейтральное окончание
  return 'ой(ая)';
}

function renderThanks(){
  const isDecline = state.attending === 'no';
  return `
    <div class="hero" style="padding-top:80px;">
      <div class="kicker">${esc(CONFIG.groomName)} &amp; ${esc(CONFIG.brideName)}</div>
    </div>
    <section class="card thanks reveal">
      <div class="big">${isDecline ? '💌' : '🎉'}</div>
      <h3>${isDecline ? 'Спасибо за ответ' : 'Ура, вы с нами!'}</h3>
      <p>${isDecline
        ? 'Жаль, что не получится увидеться в этот день — спасибо, что предупредили заранее.'
        : 'Мы получили ваш ответ и очень ждём встречи с вами ' + esc(CONFIG.eventDateHuman) + '.'}</p>
      ${!CONFIG.webhookUrl ? `<div class="banner">Демо-режим: этот ответ не был сохранён в таблицу — подключите webhookUrl, чтобы ответы реально доходили до организатора.</div>` : ''}
      <div class="btn-row">
        <button class="btn secondary" id="editAgain">Изменить ответ</button>
      </div>
    </section>
    <footer>По всем вопросам — ${esc(CONFIG.contactName)}, ${esc(CONFIG.contactPhone)}</footer>
  `;
}

function attachSentHandlers(){
  const btn = document.getElementById('editAgain');
  if(btn) btn.onclick = () => { state.step = 'form'; render(); };
}

let countdownTimer = null;
function startCountdown(){
  const el = document.getElementById('countdown');
  if(!el) return;
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }

  // Живой отсчёт: секунды тикают каждую секунду, и при каждой смене
  // значения цифра «подпрыгивает» — так весь блок выглядит динамическим,
  // а не статичной картинкой с числами.
  el.innerHTML = `
    <div class="box"><div class="num" id="cd-d">–</div><div class="lbl">дней</div></div>
    <div class="box"><div class="num" id="cd-h">–</div><div class="lbl">часов</div></div>
    <div class="box"><div class="num" id="cd-m">–</div><div class="lbl">минут</div></div>
    <div class="box sec"><div class="num" id="cd-s">–</div><div class="lbl">секунд</div></div>
  `;
  const nums = {
    d: document.getElementById('cd-d'),
    h: document.getElementById('cd-h'),
    m: document.getElementById('cd-m'),
    s: document.getElementById('cd-s')
  };
  const prev = { d:null, h:null, m:null, s:null };

  function setNum(key, value){
    const node = nums[key];
    if(!node) return;
    const str = String(value);
    if(prev[key] === str) return;
    prev[key] = str;
    node.textContent = str;
    node.classList.remove('flip');
    void node.offsetWidth; // перезапуск анимации
    node.classList.add('flip');
  }

  function tick(){
    const target = new Date(CONFIG.eventDateISO).getTime();
    const now = Date.now();
    const diff = target - now;
    if(diff <= 0){
      el.innerHTML = `<div class="countdown-done">Сегодня наш день! 🎉</div>`;
      clearInterval(countdownTimer);
      countdownTimer = null;
      return;
    }
    setNum('d', Math.floor(diff / 86400000));
    setNum('h', Math.floor((diff % 86400000) / 3600000));
    setNum('m', Math.floor((diff % 3600000) / 60000));
    setNum('s', Math.floor((diff % 60000) / 1000));
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function attachFormHandlers(){
  const form = document.getElementById('rsvpForm');

  // radio/checkbox chips
  form.querySelectorAll('.opt').forEach(chip => {
    chip.addEventListener('click', (e) => {
      e.preventDefault();
      const group = chip.dataset.group;
      const value = chip.dataset.value;
      const input = chip.querySelector('input');

      if(input.type === 'radio'){
        form.querySelectorAll(`.opt[data-group="${group}"]`).forEach(c => c.classList.remove('checked'));
        chip.classList.add('checked');
        if(group === 'attending'){ state.attending = value; }
        if(group === 'plusone'){ state.plusOne = value; }
        if(group === 'food'){ state.food = value; }
        if(group === 'pofood'){ state.plusOneFood = value; }
      } else {
        chip.classList.toggle('checked');
        const checked = chip.classList.contains('checked');
        const targetSet = group === 'drinks' ? state.drinks : state.plusOneDrinks;
        if(checked) targetSet.add(value); else targetSet.delete(value);
      }

      // если изменился attending/plusone — нужен полный ререндер, чтобы показать/скрыть блоки
      if(group === 'attending' || group === 'plusone'){
        syncStateFromInputs();
        render();
      }
    });
  });

  const nameEl = document.getElementById('f-name');
  if(nameEl) nameEl.addEventListener('input', e => state.name = e.target.value);
  const allergiesEl = document.getElementById('f-allergies');
  if(allergiesEl) allergiesEl.addEventListener('input', e => state.allergies = e.target.value);
  const notesEl = document.getElementById('f-notes');
  if(notesEl) notesEl.addEventListener('input', e => state.notes = e.target.value);
  const notesDeclineEl = document.getElementById('f-notesDecline');
  if(notesDeclineEl) notesDeclineEl.addEventListener('input', e => state.notes = e.target.value);
  const poNameEl = document.getElementById('f-plusOneName');
  if(poNameEl) poNameEl.addEventListener('input', e => state.plusOneName = e.target.value);

  form.addEventListener('submit', onSubmit);
}

function syncStateFromInputs(){
  const nameEl = document.getElementById('f-name');
  if(nameEl) state.name = nameEl.value;
}

async function onSubmit(e){
  e.preventDefault();
  syncStateFromInputs();

  let ok = true;
  document.querySelectorAll('.error').forEach(x => x.style.display = 'none');

  if(!state.name || !state.name.trim()){
    document.getElementById('err-name').style.display = 'block';
    ok = false;
  }
  if(!state.attending){
    document.getElementById('err-attending').style.display = 'block';
    ok = false;
  }
  if(state.attending === 'yes' && !state.food){
    document.getElementById('err-food').style.display = 'block';
    ok = false;
  }
  if(state.attending === 'yes' && allowPlusOne && state.plusOne === 'yes' && (!state.plusOneName || !state.plusOneName.trim())){
    document.getElementById('err-plusOneName').style.display = 'block';
    ok = false;
  }
  if(!ok) return;

  const payload = {
    linkName: linkGuestName,
    name: state.name.trim(),
    attending: state.attending === 'yes' ? 'Да' : 'Нет',
    plusOne: state.plusOne === 'yes' ? 'Да' : (state.plusOne === 'no' ? 'Нет' : ''),
    plusOneName: state.plusOneName,
    drinks: Array.from(state.drinks),
    food: state.food || '',
    plusOneDrinks: Array.from(state.plusOneDrinks),
    plusOneFood: state.plusOneFood || '',
    allergies: state.allergies,
    notes: state.notes,
    submittedAt: new Date().toISOString()
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Отправляем…';

  if(CONFIG.webhookUrl){
    try{
      await fetch(CONFIG.webhookUrl, {
        method: 'POST',
        mode: 'no-cors', // Apps Script не отдаёт CORS-заголовки; ответ не читаем, но запрос доходит и выполняется
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      });
    }catch(err){
      // не блокируем гостя — просто логируем; см. SPEC.md по отладке
      console.warn('RSVP webhook error (может быть нормально при mode:no-cors):', err);
    }
  }

  state.step = 'sent';
  render();
}

render();
setupIntroVeil();
</script>
