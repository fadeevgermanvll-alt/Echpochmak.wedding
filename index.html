<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Приглашение на свадьбу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  /* Основная тема сайта: элегантный чёрно-белый editorial-стиль (белый
     преобладает), задуман под совместное чёрно-белое фото со студийной
     фотосессии — как только оно будет готово, вставьте его в
     CONFIG.photoUrl. Это осознанный стиль, а не «светлая тема» по
     умолчанию — сайт всегда чёрно-белый, независимо от темы устройства. */
  /* Палитра целиком взята из тонов самого фото (оно нейтрально
     чёрно-белое: студийный серый фон, белые футболки, тёмные брюки/стул) —
     без добавленных цветов вроде сепии или бежевого. */
  :root{
    --bg:#dcdcda;
    --bg-card:#f7f7f5;
    --text:#181818;
    --text-soft:#828280;
    --accent:#181818;
    --accent-2:#8f8f8c;
    --line:#c9c9c6;
    --danger:#b5544a;
    --ok:#4c7a5e;
    --shadow: 0 14px 34px rgba(0,0,0,.10);
    --radius:22px;
    /* Основной шрифт — современный гротеск (без засечек/антиквы) везде,
       включая заголовки и цитату; курсив для акцентов и цитат берётся
       из курсивного начертания того же Montserrat, а не отдельного
       рукописного/антиквенного шрифта. */
    --serif:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sans:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --display:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --body-serif:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ===== Тема «люкс»: тёмный фон, золото, art-deco — по референсу пользователя.
     Это осознанный выбор оформления (не следует системной теме устройства). ===== */
  body.theme-lux{
    --bg:#0d0b0a;
    --bg-card:#171310;
    --text:#f3ead9;
    --text-soft:#b8a98f;
    --accent:#c9a24a;
    --accent-2:#8a2432;
    --line:#3a3126;
    --shadow: 0 14px 46px rgba(0,0,0,.55);
    --display:'Cinzel', Georgia, serif;
    --body-serif:'Cormorant Garamond', Georgia, serif;
    background-color:#0d0b0a;
  }
  body.theme-lux .kicker,
  body.theme-lux .section-title .sub{
    font-family:var(--sans);
    color:var(--accent);
  }
  body.theme-lux .hero h1,
  body.theme-lux .section-title,
  body.theme-lux .hero-photo .monogram{
    font-family:var(--display);
    letter-spacing:.03em;
  }
  body.theme-lux .hero .date{
    font-family:var(--body-serif);
    font-size:22px;
    letter-spacing:.06em;
  }
  body.theme-lux .greeting,
  body.theme-lux .val,
  body.theme-lux p{
    font-family:var(--body-serif);
    font-size:17px;
  }
  body.theme-lux .btn{
    background:var(--accent-2);
    color:#f3ead9;
    border:1px solid var(--accent);
  }
  body.theme-lux .btn.secondary{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
  }
  body.theme-lux .opt.checked{
    border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 20%, var(--bg-card));
    color:var(--accent);
  }
  body.theme-lux .card,
  body.theme-lux .greeting,
  body.theme-lux .countdown .box,
  body.theme-lux .hero-photo{
    border-color:var(--line);
  }
  body.theme-lux .detail-row .ico{
    filter:grayscale(1) brightness(1.7) sepia(1) hue-rotate(-8deg) saturate(2.4);
    opacity:.85;
  }
  body.theme-lux .thanks .big{
    filter:grayscale(1) brightness(1.7) sepia(1) hue-rotate(-8deg) saturate(2.4);
  }
  body.theme-lux::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 15%, rgba(201,162,74,.55), transparent),
      radial-gradient(1.5px 1.5px at 75% 8%, rgba(201,162,74,.4), transparent),
      radial-gradient(1px 1px at 60% 30%, rgba(201,162,74,.35), transparent),
      radial-gradient(1.5px 1.5px at 30% 45%, rgba(201,162,74,.3), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(201,162,74,.3), transparent),
      radial-gradient(1.5px 1.5px at 10% 70%, rgba(201,162,74,.3), transparent),
      radial-gradient(1px 1px at 50% 85%, rgba(201,162,74,.25), transparent);
    background-repeat:no-repeat;
    background-size:100% 2600px;
  }

  .intro-veil{
    position:fixed;inset:0;z-index:50;
    background:#0d0b0a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;
    cursor:pointer;
    transition:opacity .7s ease, visibility .7s ease;
  }
  .intro-veil.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .intro-veil .ring{
    width:88px;height:88px;border-radius:50%;
    border:1px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
    font-family:'Cinzel', serif;
    font-size:26px;
    animation:pulseRing 2.6s ease-in-out infinite;
  }
  @keyframes pulseRing{
    0%,100%{box-shadow:0 0 0 0 rgba(201,162,74,.25);}
    50%{box-shadow:0 0 0 10px rgba(201,162,74,0);}
  }
  .intro-veil .txt{
    font-family:var(--sans);
    font-size:11.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--text-soft);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(760px 380px at 14% -4%, rgba(0,0,0,.05), transparent 70%),
      radial-gradient(640px 320px at 90% 4%, rgba(0,0,0,.04), transparent 70%),
      radial-gradient(700px 500px at 100% 60%, rgba(0,0,0,.03), transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }
  /* Фоновая фотография (необязательная): задаётся из CONFIG.bgPhotoUrl —
     на весь экран, затемнена/размыта/обесцвечена и приглушена белой
     «дымкой» сверху, чтобы текст поверх неё оставался читаемым, а лица на
     фото не спорили за внимание с портретом в шапке. Если фото не задано —
     просто мягкий белый фон (как сейчас). */
  body:not(.theme-lux)::before{
    content:"";
    position:fixed;
    inset:-20px;
    z-index:0;
    pointer-events:none;
    background-image:var(--bg-photo, none);
    background-size:cover;
    background-position:center;
    filter:grayscale(1) blur(18px) brightness(1.12) contrast(.94);
    opacity:.22;
  }
  body:not(.theme-lux)::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:rgba(220,220,218,.78);
  }
  .ornament{
    display:flex;align-items:center;justify-content:center;gap:0;
    color:var(--accent-2);
    margin:14px 0;
  }
  .hero-photo{
    width:100%;
    max-width:270px;
    aspect-ratio:3/4;
    margin:0 auto 26px;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    gap:10px;
    background:var(--bg-card);
    border-radius:135px 135px 20px 20px;
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
  }
  .hero-photo img{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(1) contrast(1.05);
  }
  .hero-photo .monogram{
    font-family:var(--serif);
    font-size:40px;
    color:var(--text);
    display:flex;align-items:center;gap:6px;
  }
  .hero-photo .monogram .amp-small{font-style:italic;font-size:.55em;color:var(--text-soft);}
  .hero-photo .placeholder-note{
    font-family:var(--sans);
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-soft);
  }
  /* ===== Современный вариант шапки: фото на весь экран, имена и дата
     написаны поверх светлой (студийной, фоновой) части фото — она у этого
     кадра сверху, так что текст ложится на пустой светлый фон и не
     задевает фигуры. Палитра — чистый чёрно-белый, взятый из самого фото
     (без добавленных цветов). ===== */
  .hero-modern{
    position:relative;
    width:calc(100% + 40px);
    margin:0 -20px;
    aspect-ratio:3/4;
    overflow:hidden;
    background:var(--bg);
  }
  .hero-modern img{
    width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;
    filter:grayscale(1) contrast(1.08);
    transform:scale(1.08);
    transform-origin:right 58%;
  }
  /* Видео-версия шапки: зациклённое видео вместо фото, плавно проявляется
     и затухает (как в кино) через JS (см. setupHeroVideo). Стартовая
     непрозрачность 0 — чтобы не мелькнул первый кадр до начала анимации. */
  .hero-modern video{
    position:absolute; inset:0;
    width:100%;height:100%;object-fit:cover;object-position:center center;display:block;
    filter:grayscale(1) contrast(1.08);
    opacity:0;
  }
  .hero-modern .hero-fade-bottom{
    position:absolute; left:0; right:0; bottom:0; height:30%;
    background:linear-gradient(to bottom, rgba(220,220,218,0) 0%, var(--bg) 96%);
    pointer-events:none;
  }
  .hero-modern::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 34%);
    pointer-events:none;
  }
  .hero-modern .hero-overlay{
    position:absolute; left:0; right:0; top:0;
    padding:34px 28px 0;
    color:#161616;
    text-align:left;
  }
  .hero-modern .kicker{
    font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:#5c5c5a;margin-bottom:12px;
  }
  .hero-modern h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(38px,11vw,60px);
    line-height:.98;
    margin:0;
    letter-spacing:-.02em;
  }
  .hero-modern h1 .amp{
    display:inline-block;
    font-style:italic;
    font-weight:400;
    color:#c0392b;
    font-size:.62em;
    margin:0 5px;
  }
  .hero-modern .date{
    font-family:var(--sans);
    font-size:12.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#2a2a29;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid rgba(22,22,22,.22);
    display:inline-block;
  }
  .hero-below{
    text-align:center;
    padding:26px 20px 6px;
  }
  .hero-below .quote{
    font-family:var(--body-serif);
    font-style:italic;
    font-size:19px;
    color:var(--text-soft);
    padding:0 8px;
  }
  .reveal{
    opacity:0;
    transform:translateY(16px);
    transition:opacity .6s ease, transform .6s ease;
  }
  .reveal.in{
    opacity:1;
    transform:translateY(0);
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 20px 80px;position:relative;z-index:1;}
  .hero{
    text-align:center;
    padding:64px 20px 40px;
    position:relative;
  }
  .hero .kicker{
    font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-2);margin-bottom:18px;
  }
  .hero h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(34px,8vw,56px);
    margin:0 0 8px;
    line-height:1.1;
  }
  .hero .amp{
    display:block;
    font-style:italic;
    color:#c0392b;
    font-size:.55em;
    margin:6px 0;
  }
  .hero .date{
    font-family:var(--serif);
    font-size:20px;
    color:var(--text-soft);
    margin-top:14px;
  }
  .hero .quote{
    font-family:var(--body-serif);
    font-style:italic;
    font-size:19px;
    color:var(--text-soft);
    margin-top:18px;
    padding:0 12px;
  }
  .greeting{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
    margin:18px 0 28px;
    box-shadow:var(--shadow);
    font-size:15.5px;
  }
  .greeting b{color:var(--accent);}
  .countdown{
    display:flex;justify-content:center;gap:10px;margin:28px 0 8px;flex-wrap:wrap;
  }
  .countdown .box{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    min-width:68px;
    padding:12px 6px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .countdown .num{
    font-family:var(--serif);font-size:24px;font-weight:600;color:var(--accent);
    display:inline-block;
  }
  .countdown .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-soft);margin-top:2px;}
  .countdown .box.sec{border-color:#c0392b;}
  .countdown .box.sec .num{color:#c0392b;}
  @keyframes cdFlip{
    0%{ transform:translateY(-9px) scale(1.18); opacity:.2; }
    55%{ transform:translateY(2px) scale(1.05); opacity:1; }
    100%{ transform:translateY(0) scale(1); opacity:1; }
  }
  .countdown .num.flip{ animation:cdFlip .5s cubic-bezier(.34,1.56,.64,1); }
  .countdown-done{
    text-align:center;font-family:var(--serif);font-weight:700;font-size:20px;
    color:#c0392b;letter-spacing:.02em;
  }
  section.card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 26px;
    margin:22px 0;
    box-shadow:var(--shadow);
  }
  h2.section-title{
    font-family:var(--serif);
    font-size:22px;
    font-weight:600;
    margin:0 0 18px;
    text-align:center;
  }
  h2.section-title .sub{
    display:block;font-family:var(--sans);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent-2);margin-bottom:6px;font-weight:600;
  }
  .detail-row{
    display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);
  }
  .detail-row:last-child{border-bottom:none;}
  .detail-row .ico{font-size:20px;width:28px;flex-shrink:0;text-align:center;}
  .detail-row .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-soft);margin-bottom:2px;}
  .detail-row .val{font-size:15.5px;}
  .detail-row .val a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);}
  .btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:30px;
    padding:14px 28px;
    font-family:var(--sans);
    font-weight:600;
    font-size:14.5px;
    letter-spacing:.02em;
    cursor:pointer;
    text-decoration:none;
    text-align:center;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  fieldset{border:none;margin:0 0 32px;padding:0;}
  legend{
    font-weight:600;font-size:15px;margin-bottom:12px;padding:0;
    display:flex;align-items:center;gap:8px;
  }
  legend .req{color:var(--danger);font-weight:400;font-size:12px;}
  .opt-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:11px 16px;
    font-size:14px;
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
    background:var(--bg-card);
    color:var(--text);
  }
  .opt input{position:absolute;opacity:0;width:0;height:0;}
  .opt.checked{
    border-color:var(--text);
    background:var(--text);
    color:var(--bg);
    font-weight:600;
  }
  label.field{display:block;margin-bottom:24px;}
  label.field .flabel{font-weight:600;font-size:15px;margin-bottom:9px;display:block;}
  label.field .hint{font-weight:400;font-size:12.5px;color:var(--text-soft);margin-top:6px;}
  input[type=text], textarea{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:13px 15px;
    font-family:var(--sans);
    font-size:15px;
    background:#fff;
    color:var(--text);
    resize:vertical;
  }
  input[type=text]:focus, textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:112px;resize:vertical;overflow-y:hidden;}
  .banner{
    background:color-mix(in srgb, var(--accent-2) 18%, var(--bg-card));
    border:1px solid var(--accent-2);
    border-radius:14px;
    padding:14px 16px;
    font-size:13.5px;
    margin-bottom:22px;
    text-align:center;
  }
  .error{color:var(--danger);font-size:13px;margin-top:6px;display:none;}
  .thanks{text-align:center;padding:20px 4px;}
  .thanks .big{font-size:44px;margin-bottom:6px;}
  .thanks h3{font-family:var(--serif);font-size:26px;margin:6px 0;}
  .thanks-photo{
    max-width:260px;
    margin:18px auto 4px;
    border-radius:18px;
    overflow:hidden;
    box-shadow:var(--shadow);
    opacity:0;
    transform:scale(.82) translateY(14px) rotate(-3deg);
    transition:opacity .65s cubic-bezier(.34,1.56,.64,1), transform .65s cubic-bezier(.34,1.56,.64,1);
  }
  .thanks-photo.in{ opacity:1; transform:scale(1) translateY(0) rotate(0deg); }
  .thanks-photo img{ width:100%; display:block; filter:grayscale(1) contrast(1.06); }
  footer{text-align:center;color:var(--text-soft);font-size:12.5px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);}
  .divider{text-align:center;color:var(--accent-2);font-size:20px;margin:6px 0 2px;letter-spacing:6px;}
  .plusone-block{
    border:1.5px dashed var(--line);
    border-radius:14px;
    padding:16px;
    margin-top:6px;
  }
  @media (max-width:420px){
    .countdown .box{min-width:58px;padding:10px 4px;}
    .countdown .num{font-size:20px;}
  }

  /* ============================================================
     ЖИВОСТЬ И АНИМАЦИИ — визуальные улучшения по запросу:
     цепочечное появление, кинематографичный скролл в шапке,
     микро-детали интерфейса, конфетти на финальном экране.
     Всё уважает prefers-reduced-motion (см. блок в самом конце).
     ============================================================ */

  /* --- Цепочечное появление: элементы внутри блока проявляются
         друг за другом, а не все разом --- */
  .card.reveal .detail-row,
  .card.reveal .opt-grid .opt{
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .card.reveal.in .detail-row,
  .card.reveal.in .opt-grid .opt{
    opacity:1;
    transform:translateY(0);
  }
  .card.reveal.in .detail-row:nth-of-type(1){transition-delay:.04s}
  .card.reveal.in .detail-row:nth-of-type(2){transition-delay:.11s}
  .card.reveal.in .detail-row:nth-of-type(3){transition-delay:.18s}
  .card.reveal.in .detail-row:nth-of-type(4){transition-delay:.25s}
  .card.reveal.in .opt-grid .opt:nth-child(1){transition-delay:.04s}
  .card.reveal.in .opt-grid .opt:nth-child(2){transition-delay:.09s}
  .card.reveal.in .opt-grid .opt:nth-child(3){transition-delay:.14s}
  .card.reveal.in .opt-grid .opt:nth-child(4){transition-delay:.19s}
  .card.reveal.in .opt-grid .opt:nth-child(5){transition-delay:.24s}
  .card.reveal.in .opt-grid .opt:nth-child(6){transition-delay:.29s}
  .card.reveal.in .opt-grid .opt:nth-child(7){transition-delay:.34s}
  .card.reveal.in .opt-grid .opt:nth-child(8){transition-delay:.39s}

  /* --- Орнамент-разделитель «дорисовывается», а не просто проявляется --- */
  .ornament.reveal svg line,
  .ornament.reveal svg path{
    stroke-dasharray:70;
    stroke-dashoffset:70;
    transition:stroke-dashoffset .9s ease;
  }
  .ornament.reveal.in svg line,
  .ornament.reveal.in svg path{
    stroke-dashoffset:0;
  }
  .ornament.reveal.in svg path{transition-delay:.15s;}
  .ornament.reveal.in svg line:last-of-type{transition-delay:.15s;}

  /* Фото/видео в шапке — без анимации, статично, как было изначально. */
  .hero-modern img,
  .hero-modern video{
    transform:scale(1.08);
    transform-origin:right 58%;
  }

  /* --- Живые микро-детали: кнопки, поля, выбор вариантов --- */
  .btn{
    box-shadow:0 0 0 rgba(0,0,0,0);
    transition:transform .15s ease, opacity .15s ease, box-shadow .25s ease;
  }
  .btn:hover{ box-shadow:0 8px 20px rgba(0,0,0,.16); transform:translateY(-1px); }
  .btn:active{ transform:scale(.97) translateY(0); }

  .opt{ transition:all .15s ease, transform .15s ease; }
  .opt:hover{ border-color:var(--text); transform:translateY(-1px); }
  @keyframes optPop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.06); }
    100%{ transform:scale(1); }
  }
  .opt.checked{ animation:optPop .28s ease; }
  .opt:has(input:focus-visible),
  input[type=text]:focus-visible,
  textarea:focus-visible{
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  input[type=text]:focus, textarea:focus{
    transition:border-color .2s ease, box-shadow .2s ease;
  }

  .detail-row .val a{ transition:color .15s ease, border-color .15s ease; }
  .detail-row .val a:hover{ color:var(--text-soft); }

  /* --- Праздничное конфетти на финальном экране --- */
  .confetti-piece{
    position:fixed;
    top:-16px;
    width:8px;height:14px;
    pointer-events:none;
    z-index:50;
    opacity:.9;
    animation-name:confettiFall;
    animation-timing-function:cubic-bezier(.35,0,.65,1);
    animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:.95; }
    100%{ transform:translateY(105vh) rotate(540deg); opacity:0; }
  }

  /* --- Уважаем настройку «уменьшить анимацию» --- */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
      scroll-behavior:auto !important;
    }
    .hero-modern img, .hero-modern video{ animation:none; transform:scale(1.08); }
  }

</style>
</head>

}

function setupReveal(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){
    els.forEach(el => el.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('in');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  els.forEach(el => io.observe(el));
}


/* Конфетти на финальном экране после «Да, буду» — короткая праздничная
   вспышка в цветах приглашения (чёрный/белый/серый/красный акцент).
   Не запускается при «уменьшить анимацию» — тогда остаётся просто
   эмодзи-иконка без движения. */
function launchConfetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#181818', '#f7f7f5', '#8f8f8c', '#c0392b'];
  const count = 46;
  const frag = document.createDocumentFragment();
  for(let i = 0; i < count; i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const left = Math.random() * 100;
    const duration = 2.6 + Math.random() * 1.6;
    const delay = Math.random() * 0.5;
    const color = colors[i % colors.length];
    const isCircle = Math.random() > 0.5;
    el.style.left = left + 'vw';
    el.style.background = color;
    el.style.borderRadius = isCircle ? '50%' : '2px';
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = delay + 's';
    frag.appendChild(el);
  }
  document.body.appendChild(frag);
  setTimeout(() => {
    document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
  }, 4600);
}

/* Зациклённое видео в шапке с плавным проявлением/затуханием (как в кино):
   первые 0.5с — плавно проявляется, последние 0.5с перед концом — плавно
   гаснет, затем короткая пауза и запуск заново с начала. Если видео не
   может загрузиться (битая ссылка, нет доступа и т.п.) — тихо подменяем
   его на обычное фото (photoUrl), сайт не ломается. Фото всегда лежит
   базовым слоем под видео — гость никогда не видит пустое место, пока
   видео только грузится. */
let heroVideoRaf = null;
function setupHeroVideo(){
  if(heroVideoRaf){ cancelAnimationFrame(heroVideoRaf); heroVideoRaf = null; }
  const video = document.getElementById('heroVideo');
  if(!video) return;
  const FADE = 0.5; // секунды

  function fallbackToPhoto(){
    if(heroVideoRaf){ cancelAnimationFrame(heroVideoRaf); heroVideoRaf = null; }
    video.style.display = 'none';
  }

  // Если видео не начало грузиться за разумное время — считаем, что ссылка
  // недоступна, и сразу показываем фото, не заставляя гостей ждать.
  const stallTimer = setTimeout(() => {
    if(video.readyState === 0) fallbackToPhoto();
  }, 4000);

  video.addEventListener('error', fallbackToPhoto);

  video.addEventListener('loadedmetadata', () => {
    clearTimeout(stallTimer);
  });

  video.addEventListener('ended', () => {
    video.style.opacity = 0;
    setTimeout(() => {
      try{
        video.currentTime = 0;
        video.play().catch(()=>{});
      }catch(e){}
    }, 100);
  });

  function tick(){
    const dur = video.duration;
    if(!isNaN(dur) && dur > 0){
      const t = video.currentTime;
      let opacity = 1;
      if(t < FADE){
        opacity = t / FADE;
      } else if(t > dur - FADE){
        opacity = Math.max(0, (dur - t) / FADE);
      }
      video.style.opacity = opacity;
    }
    heroVideoRaf = requestAnimationFrame(tick);
  }

  video.play().catch(() => { /* автоплей заблокирован браузером — подождём взаимодействия пользователя */ });
  heroVideoRaf = requestAnimationFrame(tick);
}

let countdownTimer = null;
function startCountdown(){
  const el = document.getElementById('countdown');
  if(!el) return;
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }

  // Живой отсчёт: секунды тикают каждую секунду, и при каждой смене
  // значения цифра «подпрыгивает» — так весь блок выглядит динамическим,
  // а не статичной картинкой с числами.
  el.innerHTML = `
    <div class="box"><div class="num" id="cd-d">–</div><div class="lbl">дней</div></div>
    <div class="box"><div class="num" id="cd-h">–</div><div class="lbl">часов</div></div>
    <div class="box"><div class="num" id="cd-m">–</div><div class="lbl">минут</div></div>
    <div class="box sec"><div class="num" id="cd-s">–</div><div class="lbl">секунд</div></div>
  `;
  const nums = {
    d: document.getElementById('cd-d'),
    h: document.getElementById('cd-h'),
    m: document.getElementById('cd-m'),
    s: document.getElementById('cd-s')
  };
  const prev = { d:null, h:null, m:null, s:null };

  function setNum(key, value){
    const node = nums[key];
    if(!node) return;
    const str = String(value);
    if(prev[key] === str) return;
    prev[key] = str;
    node.textContent = str;
    node.classList.remove('flip');
    void node.offsetWidth; // перезапуск анимации
    node.classList.add('flip');
  }

  function tick(){
    const target = new Date(CONFIG.eventDateISO).getTime();
    const now = Date.now();
    const diff = target - now;
    if(diff <= 0){
      el.innerHTML = `<div class="countdown-done">Сегодня наш день! 🎉</div>`;
      clearInterval(countdownTimer);
      countdownTimer = null;
      return;
    }
    setNum('d', Math.floor(diff / 86400000));
    setNum('h', Math.floor((diff % 86400000) / 3600000));
    setNum('m', Math.floor((diff % 3600000) / 60000));
    setNum('s', Math.floor((diff % 60000) / 1000));
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function attachFormHandlers(){
  const form = document.getElementById('rsvpForm');

  // radio/checkbox chips
  form.querySelectorAll('.opt').forEach(chip => {
    chip.addEventListener('click', (e) => {
      e.preventDefault();
      const group = chip.dataset.group;
      const value = chip.dataset.value;
      const input = chip.querySelector('input');

      if(input.type === 'radio'){
        form.querySelectorAll(`.opt[data-group="${group}"]`).forEach(c => c.classList.remove('checked'));
        chip.classList.add('checked');
        if(group === 'attending'){ state.attending = value; }
        if(group === 'plusone'){ state.plusOne = value; }
        if(group === 'food'){ state.food = value; }
        if(group === 'pofood'){ state.plusOneFood = value; }
      } else {
        chip.classList.toggle('checked');
        const checked = chip.classList.contains('checked');
        const targetSet = group === 'drinks' ? state.drinks : state.plusOneDrinks;
        if(checked) targetSet.add(value); else targetSet.delete(value);
      }

      // если изменился attending/plusone — нужен полный ререндер, чтобы показать/скрыть блоки
      if(group === 'attending' || group === 'plusone'){
        syncStateFromInputs();
        render();
      }
    });
  });

  const nameEl = document.getElementById('f-name');
  if(nameEl) nameEl.addEventListener('input', e => state.name = e.target.value);
  const allergiesEl = document.getElementById('f-allergies');
  if(allergiesEl) allergiesEl.addEventListener('input', e => state.allergies = e.target.value);
  const notesEl = document.getElementById('f-notes');
  if(notesEl) notesEl.addEventListener('input', e => state.notes = e.target.value);
  const notesDeclineEl = document.getElementById('f-notesDecline');
  if(notesDeclineEl) notesDeclineEl.addEventListener('input', e => state.notes = e.target.value);
  const poNameEl = document.getElementById('f-plusOneName');
  if(poNameEl) poNameEl.addEventListener('input', e => state.plusOneName = e.target.value);

  setupAutoGrowTextareas(form);

  form.addEventListener('submit', onSubmit);
}

/* Textarea сама увеличивается по высоте, если текста больше не помещается —
   не нужно вручную тянуть за уголок. Пересчитываем высоту и сразу при
   открытии формы (если там уже есть сохранённый текст), и на каждый ввод. */
function setupAutoGrowTextareas(scope){
  const areas = (scope || document).querySelectorAll('textarea');
  areas.forEach(el => {
    const grow = () => {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    };
    grow();
    el.addEventListener('input', grow);
  });
}

function syncStateFromInputs(){
  const nameEl = document.getElementById('f-name');
  if(nameEl) state.name = nameEl.value;
}

async function onSubmit(e){
  e.preventDefault();
  syncStateFromInputs();

  let ok = true;
  document.querySelectorAll('.error').forEach(x => x.style.display = 'none');

  if(!state.name || !state.name.trim()){
    document.getElementById('err-name').style.display = 'block';
    ok = false;
  }
  if(!state.attending){
    document.getElementById('err-attending').style.display = 'block';
    ok = false;
  }
  if(state.attending === 'yes' && !state.food){
    document.getElementById('err-food').style.display = 'block';
    ok = false;
  }
  if(state.attending === 'yes' && allowPlusOne && state.plusOne === 'yes' && (!state.plusOneName || !state.plusOneName.trim())){
    document.getElementById('err-plusOneName').style.display = 'block';
    ok = false;
  }
  if(!ok) return;

  const payload = {
    linkName: linkGuestName,
    name: state.name.trim(),
    attending: state.attending === 'yes' ? 'Да' : 'Нет',
    plusOne: state.plusOne === 'yes' ? 'Да' : (state.plusOne === 'no' ? 'Нет' : ''),
    plusOneName: state.plusOneName,
    drinks: Array.from(state.drinks),
    food: state.food || '',
    plusOneDrinks: Array.from(state.plusOneDrinks),
    plusOneFood: state.plusOneFood || '',
    allergies: state.allergies,
    notes: state.notes,
    submittedAt: new Date().toISOString()
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Отправляем…';

  if(CONFIG.webhookUrl){
    try{
      await fetch(CONFIG.webhookUrl, {
        method: 'POST',
        mode: 'no-cors', // Apps Script не отдаёт CORS-заголовки; ответ не читаем, но запрос доходит и выполняется
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      });
    }catch(err){
      // не блокируем гостя — просто логируем; см. SPEC.md по отладке
      console.warn('RSVP webhook error (может быть нормально при mode:no-cors):', err);
    }
  }

  state.step = 'sent';
  render();
}

render();
setupIntroVeil();
</script>
